name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package & release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCDS_INSTALL=ON
          -DCDS_BUILD_TESTS=OFF
          -DCDS_BUILD_BENCHMARKS=OFF
          -DCDS_BUILD_EXAMPLES=OFF

      - name: Package
        run: cmake --build build --target package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/cds-*.tar.gz*
          generate_release_notes: true
